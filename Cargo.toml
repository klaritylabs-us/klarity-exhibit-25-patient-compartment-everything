[package]
name = "klarity-exhibit-25-patient-compartment-everything"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Patient compartment and $everything bundle checks"
publish = false

[lib]
name = "patient_everything"
path = "src/lib.rs"

[[bin]]
name = "validate-everything-bundle"
path = "src/bin/validate_everything_bundle.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
